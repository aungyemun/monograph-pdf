# Rejects AI-assistant Co-authored-by trailers in new commits (human co-authors are fine).
# Checks only the commits a pull request or push adds; published history is left as it is.
name: Commit message check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-message-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trailers:
    name: No AI co-author trailers
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER^!"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Checking $range"
          python3 scripts/ci/check_commit_trailers.py --range "$range"
