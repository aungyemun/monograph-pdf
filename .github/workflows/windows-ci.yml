# Windows CI for Monograph PDF: dependency check, the automated test suite (unit, integration and
# offscreen UI tests, including the security, release-integrity and source-archive privacy tests)
# with a per-category summary, plus release-note validation and OCR with a hash-verified engine.
# It never builds, signs or publishes a release and never uploads documents.
name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      MONOGRAPH_PDF_HEADLESS: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MONOGRAPH_TEST_CATEGORY_REPORT: ${{ github.workspace }}\tests\outputs\junit\categories.md
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Dependency consistency
        run: python -m pip check

      # OCR: Tesseract 5.4.0.20240606 from the approved Chocolatey package (installer embedded in the
      # package), then staged only if every file is SHA-256 identical to the engine the release ships
      # (scripts/ci/ocr_engine_pins.json); language data likewise. Otherwise OCR tests are skipped and
      # reported NOT VERIFIED.
      - name: Install OCR engine (pinned version)
        continue-on-error: true
        run: choco install tesseract --version 5.4.0.20240606 -y --no-progress

      - name: Stage OCR engine if identical to the shipped one
        run: python scripts\ci\stage_ocr_engine.py --from "C:\Program Files\Tesseract-OCR"

      - name: Release-note validation
        shell: pwsh
        run: |
          # Windows notes only (vX.Y.Z.md). Platform-qualified files (vX.Y.Z-linux.md) are separate.
          $failed = $false
          foreach ($notes in Get-ChildItem docs\releases\v*.md) {
            if ($notes.BaseName -notmatch '^v\d+\.\d+\.\d+$') { continue }
            $version = $notes.BaseName.Substring(1)
            python scripts\packaging\validate_release_notes.py $notes.FullName --version $version --changelog CHANGELOG.md --repo-root .
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # Software bill of materials (CycloneDX 1.5) from the pinned inventories; generated and checked on
      # every run, kept with the test results. No release is built here.
      - name: SBOM (CycloneDX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests\outputs\junit | Out-Null
          python scripts\packaging\make_sbom.py --out tests\outputs\junit\MonographPDF_SBOM.cdx.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts\packaging\make_sbom.py --check tests\outputs\junit\MonographPDF_SBOM.cdx.json

      - name: Tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests\outputs\junit | Out-Null
          python -m pytest -p no:cacheprovider -o addopts="" -q -rs --timeout=900 --timeout-method=thread `
            --junitxml=tests\outputs\junit\ci.xml tests\unit tests\integration tests\ui

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          "## Test categories" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "Microsoft Office and the maintainer's private PDFs are not available on GitHub runners, and OCR runs only when the staged engine is identical to the shipped one: such tests are SKIPPED and a category whose tests were all skipped is reported NOT VERIFIED, never as passed." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (Test-Path $env:MONOGRAPH_TEST_CATEGORY_REPORT) { Get-Content $env:MONOGRAPH_TEST_CATEGORY_REPORT | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }

      - name: Upload test results (JUnit XML, category summary, SBOM)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-windows
          path: |
            tests/outputs/junit/ci.xml
            tests/outputs/junit/categories.md
            tests/outputs/junit/MonographPDF_SBOM.cdx.json
          retention-days: 14
          if-no-files-found: warn
